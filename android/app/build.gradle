apply plugin: 'com.android.application'

android {
    compileSdk = 36
    buildToolsVersion = "36.0.0"
    ndkVersion = "27.3.13750724"
    namespace = "org.openttd.android"

    defaultConfig {
        applicationId = 'org.openttd.android'
        minSdkVersion = 24
        targetSdkVersion = 36

        versionCode = 1
        versionName = '0.1.0'
        if (!project.hasProperty('skipNativeBuild')) {
            externalNativeBuild {
                cmake {
                    arguments '-DANDROID_STL=c++_shared', '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON'
                    targets 'openttd', 'copy_assets'
                    if (project.hasProperty('abiFilter')) {
                        abiFilters project.property('abiFilter').split(',')
                    } else {
                        abiFilters 'arm64-v8a'
                    }
                }
            }
        }
    }
    buildTypes {
        release {
            signingConfig = signingConfigs.debug
        }
    }

    sourceSets.main {
        jniLibs.srcDirs = ['libs']
        java {
            srcDir('src/main/java')
        }
    }
    if (!project.hasProperty('skipNativeBuild')) {
        externalNativeBuild {
            cmake {
                version = "4.1.2"
                path = 'src/main/CMakeLists.txt'
            }
        }
    }

    lintOptions {
        abortOnError = false
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation fileTree(include: ['*.jar'], dir: 'libs')
}

configurations.implementation {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
}
